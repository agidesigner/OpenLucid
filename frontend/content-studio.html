<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLucid</title>
  <script>
    document.documentElement.style.display='none';
    fetch('/api/v1/auth/me').then(r=>{
      if(!r.ok) fetch('/api/v1/auth/setup-status').then(r=>r.json()).then(s=>{
        location.href=s.needs_setup?'/install.html':'/signin.html';
      });
      else document.documentElement.style.display='';
    });
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        sidebar: { DEFAULT: '#1C1C28', hover: '#2A2A3C' },
        accent: { DEFAULT: '#155EEF', light: '#EFF4FF', hover: '#1849C6' },
      }}}
    }
  </script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pinned-apps.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/apps-shared.js"></script>
  <script src="/js/header-selectors.js"></script>
  <script src="/js/trend-panel.js"></script>
  <script src="/js/lang-picker.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/memory-save.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
    .sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#A0A0B0;font-size:14px;cursor:pointer;transition:all .15s}
    .sidebar-item:hover{background:#2A2A3C;color:#E0E0EE}
    .sidebar-item.active{background:#2D2D40;color:#fff}
    .content-output{white-space:pre-wrap;line-height:1.8;font-size:14px}
  </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden" x-data="contentStudioPage()" x-init="init()">

  <!-- Sidebar -->
  <aside class="w-56 bg-sidebar flex flex-col shrink-0">
    <div class="px-4 py-5 flex items-center gap-2.5">
      <img src="/images/logo.png" alt="OpenLucid" class="w-8 h-8 rounded-lg">
      <span class="text-white font-semibold text-base">OpenLucid</span>
    </div>
    <nav class="flex-1 px-3 space-y-1 mt-2">
      <a href="/" class="sidebar-item">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span x-text="t('sidebar_offers')"></span>
      </a>
      <a href="/brandkit-list.html" class="sidebar-item">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
        <span x-text="t('sidebar_brandkit')"></span>
      </a>
      <a href="/creations.html" class="sidebar-item">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span x-text="t('sidebar_creations')"></span>
      </a>
      <a href="/video-studio.html" class="sidebar-item">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        <span x-text="t('sidebar_videos')"></span>
      </a>
    </nav>
    <div class="px-3 pb-3 mt-auto">
      <div class="text-[10px] text-white/25 text-center">Powered by <a href="https://openlucid.ai/?ref=app" target="_blank" class="hover:text-white/40 transition-colors">OpenLucid</a></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b px-6 shrink-0">
      <div class="h-14 flex items-center gap-2">
        <a href="/" class="text-sm text-gray-400 hover:text-accent" x-text="t('breadcrumb_home')"></a>
        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span class="text-sm font-medium text-gray-800" x-text="'📝 ' + t('content_studio_title')"></span>
        <span class="text-xs text-gray-400 ml-1" x-text="'· ' + t('content_studio_subtitle')"></span>
        <div class="flex-1"></div>
        <div class="flex items-center gap-3">
          <a href="/setting.html?section=mcp" class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-500 hover:text-gray-700 border border-gray-200 hover:border-gray-300 px-2.5 py-1.5 rounded-lg transition-colors">
            <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>
            MCP
          </a>
          <div id="avatar-mount"></div>
        </div>
      </div>
      <!-- Selectors row -->
      <div class="pb-4 flex items-center gap-4 flex-wrap">
        <!-- Offer -->
        <div class="flex items-center gap-2">
          <label class="text-sm text-gray-500 shrink-0" x-text="t('offer_label')"></label>
          <select x-model="offerId" @change="onOfferChange()"
                  class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent min-w-[14rem]">
            <template x-for="o in offers" :key="o.id">
              <option :value="o.id" x-text="o.name"></option>
            </template>
          </select>
        </div>
        <!-- Strategy Unit -->
        <div class="flex items-center gap-2" x-show="offerId && strategyUnits.length > 0" x-cloak>
          <label class="text-sm text-gray-500 shrink-0" x-text="t('strategy_label')"></label>
          <select x-model="strategyUnitId" @change="onStrategyChange()"
                  class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent min-w-[10rem]">
            <option value="" x-text="t('strategy_none')"></option>
            <template x-for="su in strategyUnits" :key="su.id">
              <option :value="su.id" x-text="su.name"></option>
            </template>
          </select>
        </div>
        <!-- LLM model — composite (config_id::model_name) keys -->
        <div class="flex items-center gap-2" x-show="modelOptions.length > 0" x-cloak>
          <label class="text-sm text-gray-500 shrink-0" x-text="t('model_label')"></label>
          <select x-model="modelKey" @change="onModelChange()"
                  class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent min-w-[10rem]">
            <template x-for="m in modelOptions" :key="m.key">
              <option :value="m.key" x-text="m.label"></option>
            </template>
          </select>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <!-- Two-column: Context panel + Composer/Result -->
      <div class="flex gap-5 max-w-5xl mx-auto">
        <!-- Left: Context Panel -->
        <div x-show="offerId" class="w-64 shrink-0 flex flex-col gap-4">
          <div class="bg-white rounded-xl border p-5 sticky top-0">
            <h3 class="font-semibold text-gray-800 mb-4 flex items-center gap-2">
              <span x-text="t('context_title')"></span>
              <span x-show="loadingCtx" class="text-xs text-gray-400 font-normal" x-text="t('loading')"></span>
            </h3>
            <div x-show="contextData" class="space-y-3">
              <div>
                <div class="text-xs text-gray-400 mb-0.5" x-text="t('offer_name_label')"></div>
                <div class="text-sm font-medium text-gray-800" x-text="contextData?.offer_name || '-'"></div>
              </div>
              <div x-show="selectedUnit">
                <div class="text-xs text-gray-400 mb-0.5" x-text="t('strategy_name_label')"></div>
                <div class="text-sm font-medium text-gray-800" x-text="selectedUnit?.name || '-'"></div>
                <div x-show="selectedUnit?.audience_segment" class="text-xs text-gray-400 mt-1" x-text="selectedUnit?.audience_segment"></div>
                <div x-show="selectedUnit?.scenario" class="text-xs text-gray-400" x-text="selectedUnit?.scenario"></div>
              </div>
              <div class="pt-2 border-t border-gray-50">
                <div class="flex items-center justify-between text-xs">
                  <span class="text-gray-500" x-text="t('kb_count_label')"></span>
                  <span class="text-gray-700 font-medium" x-text="contextData?.knowledge_count ?? 0"></span>
                </div>
              </div>
              <div class="pt-2 border-t border-gray-50 flex items-center gap-2">
                <div :class="(contextData?.knowledge_count ?? 0) > 0 ? 'bg-green-500' : 'bg-orange-400'" class="w-2 h-2 rounded-full shrink-0"></div>
                <span class="text-xs" :class="(contextData?.knowledge_count ?? 0) > 0 ? 'text-green-600' : 'text-orange-500'"
                      x-text="(contextData?.knowledge_count ?? 0) > 0 ? t('kb_ready') : t('kb_empty_hint')"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Composer + Result -->
        <div class="flex-1 min-w-0">

        <!-- No offers warning -->
        <div x-show="!loading && offers.length === 0" class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 flex items-center justify-between">
          <div class="flex items-center gap-2 text-sm text-amber-800">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span x-text="t('cs_no_offer_hint')"></span>
          </div>
          <a href="/" class="text-xs font-medium text-amber-700 hover:text-amber-900 underline" x-text="t('cs_go_create_offer')"></a>
        </div>

        <!-- Composer -->
        <div class="bg-white rounded-xl border p-5 mb-4">
          <!-- Trend-bridge — inherited banner (when arriving via topic_plan_id) -->
          <div x-show="trendInherited" x-cloak
               class="mb-3 bg-orange-50 border border-orange-200 rounded-lg p-3">
            <div class="text-xs text-orange-700 font-medium flex items-center gap-1.5">
              <span>🔥</span>
              <span x-text="t('trend_inherited_banner')"></span>
              <span class="text-orange-600 font-normal" x-text="trendInherited?.event"></span>
            </div>
            <details class="mt-1.5">
              <summary class="text-[11px] text-orange-600 cursor-pointer hover:text-orange-800" x-text="t('trend_details')"></summary>
              <div class="text-[11px] text-orange-700 mt-1 space-y-0.5 pl-1">
                <div x-show="trendInherited?.keywords?.length">
                  <span class="opacity-70" x-text="t('trend_keywords') + ':'"></span>
                  <span x-text="(trendInherited?.keywords || []).join('、')"></span>
                </div>
                <div x-show="trendInherited?.public_attention">
                  <span class="opacity-70" x-text="t('trend_attention') + ':'"></span>
                  <span x-text="trendInherited?.public_attention"></span>
                </div>
                <div x-show="trendInherited?.risk_zones?.length">
                  <span class="opacity-70" x-text="t('trend_risks') + ':'"></span>
                  <ul class="list-disc list-inside ml-1">
                    <template x-for="r in (trendInherited?.risk_zones || [])" :key="r"><li x-text="r"></li></template>
                  </ul>
                </div>
              </div>
            </details>
          </div>

          <!-- Trend-bridge — direct input panel (collapsible) -->
          <details class="mb-4 border border-gray-200 rounded-lg overflow-hidden"
                   :open="trendPanelOpen"
                   @toggle="trendPanelOpen = $event.target.open">
            <summary class="px-3 py-2 text-sm font-medium text-gray-700 cursor-pointer select-none hover:bg-gray-50 transition-colors flex items-center gap-2">
              <span x-text="t('hotspot_panel_label')"></span>
              <span class="text-xs text-gray-400 font-normal" x-text="t('hotspot_panel_optional')"></span>
              <span x-show="trendText" x-cloak
                    class="ml-auto text-[11px] bg-orange-50 text-orange-600 px-2 py-0.5 rounded-full font-medium"
                    x-text="(trendText||'').length + ' chars'"></span>
            </summary>
            <div class="px-3 py-3 border-t border-gray-100 space-y-3">
              <p class="text-xs text-gray-500 leading-relaxed" x-text="t('hotspot_panel_hint')"></p>
              <div>
                <label class="block text-xs text-gray-500 mb-1" x-text="t('hotspot_url_label')"></label>
                <div class="flex gap-2">
                  <input x-model="trendUrl" type="url"
                         :placeholder="t('hotspot_url_placeholder')"
                         class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
                  <button type="button"
                          @click="trendExtract()"
                          :disabled="!trendUrl || trendExtracting"
                          class="text-xs font-medium text-accent border border-accent/40 hover:bg-accent/5 disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 shrink-0">
                    <svg x-show="trendExtracting" class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
                    <span x-text="trendExtracting ? t('hotspot_extracting') : t('hotspot_extract_btn')"></span>
                  </button>
                </div>
              </div>
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="block text-xs text-gray-500" x-text="t('hotspot_text_label')"></label>
                  <button type="button" x-show="trendText"
                          @click="trendText=''; trendUrl=''"
                          class="text-[11px] text-gray-400 hover:text-gray-600"
                          x-text="t('hotspot_clear')"></button>
                </div>
                <textarea x-model="trendText" rows="6" maxlength="8000"
                          :placeholder="t('hotspot_text_placeholder')"
                          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-700 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent resize-y"></textarea>
                <div class="flex items-center justify-between text-[11px] mt-1">
                  <span class="ml-auto text-gray-400 tabular-nums" x-text="(trendText||'').length + ' / 8000'"></span>
                </div>
              </div>
            </div>
          </details>

          <div class="mb-4">
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-medium text-gray-600" x-text="t('topic_label')"></label>
              <button @click="suggestTopic()"
                      :disabled="!offerId || suggestingTopic"
                      class="text-xs text-accent hover:text-accent-hover disabled:opacity-40 transition flex items-center gap-1">
                <svg x-show="!suggestingTopic" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                <svg x-show="suggestingTopic" class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
                <span x-text="t('suggest_topic')"></span>
              </button>
            </div>
            <textarea x-model="topic"
                      :placeholder="t('cs_topic_placeholder')"
                      rows="2"
                      class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent resize-none"></textarea>
          </div>

          <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
              <label class="text-[11px] text-gray-400 mb-1 block" x-text="t('platform_label')"></label>
              <select x-model="platformId"
                      class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
                <template x-for="p in platforms" :key="p.id">
                  <option :value="p.id" x-text="p.emoji + ' ' + p.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="text-[11px] text-gray-400 mb-1 block" x-text="t('goal_label')"></label>
              <select x-model="goalId"
                      class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
                <template x-for="g in goalOptions" :key="g.id">
                  <option :value="g.id" x-text="g.emoji + ' ' + g.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="text-[11px] text-gray-400 mb-1 block" x-text="t('persona_label')"></label>
              <select x-model="personaId"
                      class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
                <option value="" x-text="t('persona_any')"></option>
                <template x-for="p in personas" :key="p.id">
                  <option :value="p.id" x-text="p.emoji + ' ' + p.name"></option>
                </template>
              </select>
            </div>
            <!-- Output Language — defaults to KB language (auto), user can override. -->
            <div>
              <label class="text-[11px] text-gray-400 mb-1 block" x-text="t('language_label')"></label>
              <select x-model="outputLang"
                      @change="languageManualOverride = true"
                      class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
                <option value="zh" x-text="t('language_zh')"></option>
                <option value="en" x-text="t('language_en')"></option>
              </select>
            </div>
          </div>

          <p class="text-[11px] text-gray-400 mb-3">
            💡 <span x-text="t('prompt_customizable_hint')"></span>
            <a :href="t('prompt_customizable_url')"
               target="_blank" rel="noopener"
               class="text-accent hover:underline" x-text="t('prompt_customizable_link')"></a>
          </p>

          <div class="flex justify-end">
            <button @click="doGenerate()"
                    :disabled="loading || !offerId"
                    class="ai-cta bg-gradient-to-r from-purple-600 to-accent text-white px-6 py-2.5 rounded-lg text-[13px] font-medium disabled:opacity-50 flex items-center gap-2">
              <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
              <svg x-show="!loading" class="w-4 h-4 ai-spark" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l1.8 5.5L19 9l-5.2 1.5L12 16l-1.8-5.5L5 9l5.2-1.5z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/></svg>
              <span x-show="loading" x-text="t('generating')"></span>
              <span x-show="!loading && !scriptResult" x-text="t('generate_btn')"></span>
              <span x-show="!loading && scriptResult" x-text="t('cs_generate_again')"></span>
            </button>
          </div>
        </div>

        <!-- Result -->
        <div x-show="scriptResult || structuredContent" x-cloak class="bg-white rounded-xl border p-6">
          <!-- Metadata: title + hashtags (text_post / article / thread) -->
          <template x-if="structuredContent?.metadata">
            <div class="mb-4 pb-4 border-b border-gray-100">
              <h2 x-show="structuredContent.metadata.title" class="text-lg font-semibold text-gray-800 mb-2" x-text="structuredContent.metadata.title"></h2>
              <div x-show="structuredContent.metadata.hashtags?.length" class="flex flex-wrap gap-1.5">
                <template x-for="tag in (structuredContent.metadata.hashtags || [])" :key="tag">
                  <span class="od-tag od-tag-primary" x-text="tag"></span>
                </template>
              </div>
            </div>
          </template>

          <!-- Sections -->
          <div x-show="structuredContent?.sections" class="space-y-4">
            <template x-for="[sid, sec] in Object.entries(structuredContent?.sections || {})" :key="sid">
              <div class="group">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider" x-text="sid"></div>
                  <div x-show="creationId && editingSectionId !== sid"
                       class="flex items-center gap-1">
                    <button @click="startEditSection(sid, sec.text)"
                            :title="t('section_edit_tip')"
                            class="text-[11px] text-gray-400 hover:text-accent px-1.5 py-0.5 rounded hover:bg-gray-50 transition-colors flex items-center gap-1">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                      <span x-text="t('section_edit')"></span>
                    </button>
                    <button @click="openRefineModal([sid])"
                            :title="t('section_refine_tip')"
                            class="text-[11px] text-accent hover:text-accent-hover px-1.5 py-0.5 rounded hover:bg-accent/5 transition-colors flex items-center gap-1">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                      <span x-text="t('section_refine')"></span>
                    </button>
                  </div>
                </div>
                <div x-show="editingSectionId === sid">
                  <textarea x-model="editingSectionText" rows="6"
                            class="w-full border border-accent/30 rounded-lg px-3 py-2 text-sm text-gray-700 leading-relaxed focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent"></textarea>
                  <div class="flex items-center justify-end gap-2 mt-2">
                    <button @click="cancelEditSection()"
                            class="text-xs text-gray-500 hover:text-gray-700 px-3 py-1.5 rounded-lg" x-text="t('btn_cancel')"></button>
                    <button @click="saveEditSection(sid)"
                            :disabled="editingSaving || !editingSectionText.trim()"
                            class="text-xs bg-accent text-white px-3 py-1.5 rounded-lg hover:bg-accent-hover disabled:opacity-50 transition-colors">
                      <span x-text="editingSaving ? t('saving') : t('btn_save')"></span>
                    </button>
                  </div>
                </div>
                <p x-show="editingSectionId !== sid"
                   class="text-sm text-gray-700 content-output" x-text="sec.text"></p>
              </div>
            </template>

            <!-- End-of-content action card — same layout as script-writer
                 minus Generate Video (text-only platform). Two clusters:
                   1) Utility (icon-only): Copy / Edit directly
                   2) Primary: Rewrite with AI (solid accent) -->
            <div x-show="creationId"
                 class="rounded-xl border border-accent/20 bg-accent/5 px-4 py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="text-center sm:text-left">
                <p class="text-sm font-semibold text-gray-800" x-text="t('refine_cta_title')"></p>
                <p class="text-[11px] text-gray-500 mt-0.5" x-text="t('refine_cta_subtitle')"></p>
              </div>
              <div class="flex items-center gap-1.5 shrink-0 flex-wrap justify-center sm:justify-end">
                <!-- Utility cluster: copy + manual edit (icon-only, 36×36) -->
                <button @click="copyAll()"
                        :title="copied ? t('copied') : t('copy_btn')"
                        class="w-9 h-9 inline-flex items-center justify-center rounded-lg text-gray-500 hover:text-accent hover:bg-white border border-transparent hover:border-gray-200 transition-all">
                  <svg x-show="!copied" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                  <svg x-show="copied" class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                </button>
                <button x-show="Object.keys(structuredContent?.sections || {}).length >= 1"
                        @click="startEditFromCta()"
                        :title="t('refine_cta_edit_directly')"
                        class="w-9 h-9 inline-flex items-center justify-center rounded-lg text-gray-500 hover:text-accent hover:bg-white border border-transparent hover:border-gray-200 transition-all">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <!-- Subtle divider between utility and primary clusters -->
                <div class="hidden sm:block w-px h-5 bg-accent/20 mx-1"></div>
                <!-- Cover image — opens the side panel; uses purple to
                     distinguish from the accent-colored Rewrite action,
                     and to hint at the visual / image domain. -->
                <button @click="openCoverPanel()"
                        class="inline-flex items-center gap-1.5 bg-purple-600/90 hover:bg-purple-500 text-white px-3.5 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all"
                        :title="t('cover_btn_title')">
                  <span>🎨</span>
                  <span x-text="t('cover_btn')"></span>
                </button>
                <!-- Primary: Rewrite with AI -->
                <button @click="openRefineModal(Object.keys(structuredContent?.sections || {}))"
                        class="inline-flex items-center gap-1.5 bg-accent hover:bg-accent-hover text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                  <span x-text="t('refine_cta_btn')"></span>
                </button>
              </div>
            </div>

            <!-- Inline cover strip — mirrors the side-panel state so a
                 user who closed / never-opened the panel still gets
                 visible feedback in the article body. Three mutually
                 exclusive states: generating / ready / failed. Hidden
                 entirely when nothing is happening. -->
            <div x-show="cover.generating || cover.imageUrl || cover.error"
                 class="rounded-xl border p-3 mt-3"
                 :class="cover.error ? 'border-red-200 bg-red-50/40' : 'border-purple-200 bg-purple-50/40'">
              <!-- Generating -->
              <div x-show="cover.generating" class="flex items-center gap-3">
                <div class="shrink-0 w-24 h-16 rounded bg-gradient-to-br from-purple-100 to-purple-200 animate-pulse flex items-center justify-center">
                  <span class="text-2xl opacity-50">🎨</span>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-purple-700" x-text="t('cover_inline_generating')"></p>
                  <p class="text-[11px] text-purple-500/80 mt-0.5" x-text="t('cover_inline_generating_hint')"></p>
                </div>
                <button @click="openCoverPanel()"
                        class="shrink-0 text-[11px] text-purple-600 hover:text-purple-800 underline"
                        x-text="t('cover_inline_view_panel')"></button>
              </div>
              <!-- Ready -->
              <div x-show="!cover.generating && cover.imageUrl" class="flex items-center gap-3">
                <button @click="openCoverPanel()"
                        :title="t('cover_inline_open_panel')"
                        class="shrink-0 w-24 h-16 rounded overflow-hidden bg-white border border-purple-200 hover:ring-2 hover:ring-purple-400 transition-all">
                  <img :src="cover.imageUrl" class="w-full h-full object-cover" />
                </button>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-purple-700 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    <span x-text="t('cover_inline_ready')"></span>
                  </p>
                  <p class="text-[11px] text-purple-500/80 mt-0.5" x-text="t('cover_inline_ready_hint')"></p>
                </div>
                <div class="shrink-0 flex items-center gap-2">
                  <button @click="openCoverPanel()"
                          class="text-[11px] text-purple-600 hover:text-purple-800 underline"
                          x-text="t('cover_inline_refine_link')"></button>
                  <a :href="cover.imageUrl" target="_blank" download
                     class="text-[11px] text-purple-600 hover:text-purple-800 underline"
                     x-text="t('cover_download')"></a>
                </div>
              </div>
              <!-- Failed -->
              <div x-show="!cover.generating && !cover.imageUrl && cover.error"
                   class="flex items-center gap-3">
                <div class="shrink-0 w-24 h-16 rounded bg-white border border-red-200 flex items-center justify-center">
                  <span class="text-2xl">⚠️</span>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-red-700" x-text="t('cover_inline_failed')"></p>
                  <p class="text-[11px] text-red-500/90 mt-0.5 truncate" :title="cover.error" x-text="cover.error"></p>
                </div>
                <button @click="openCoverPanel()"
                        class="shrink-0 inline-flex items-center gap-1 text-[11px] font-medium text-red-700 border border-red-300 hover:bg-red-100 px-2.5 py-1.5 rounded-md transition-colors">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  <span x-text="t('cover_inline_retry')"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Plain text fallback -->
          <div x-show="!structuredContent" class="content-output text-sm text-gray-700" x-text="scriptResult"></div>

          <!-- Actions -->
          <div class="mt-5 pt-4 border-t border-gray-100 flex items-center gap-3 flex-wrap">
            <span class="text-xs text-gray-400" x-text="t('word_count_label') + '：' + (scriptResult || '').length"></span>
            <span x-show="creationId" class="od-chip od-chip-success flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              <span x-text="t('auto_saved')"></span>
            </span>
            <div class="flex-1"></div>
            <a x-show="creationId" :href="'/creations.html?highlight=' + creationId"
               class="text-xs text-gray-500 hover:text-accent transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span x-text="t('view_in_library')"></span>
            </a>
            <button @click="copyAll()" class="text-xs text-accent hover:text-accent-hover transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              <span x-text="copied ? t('copied') : t('copy_btn')"></span>
            </button>
          </div>
        </div>

        <!-- Empty state -->
        <div x-show="!scriptResult && !loading" class="text-center py-12 text-gray-400 text-sm">
          <div class="text-4xl mb-2">📝</div>
          <p x-text="t('cs_empty_hint')"></p>
          <a x-show="offerId" :href="'/topic-studio.html?offer_id=' + offerId"
             class="inline-block mt-3 text-xs text-accent hover:underline">
            <span x-text="t('cs_pick_topic')"></span> →
          </a>
        </div>
        </div><!-- /right col -->
      </div><!-- /two-col wrapper -->
    </main>
  </div>

  <!-- AI Section Refinement Modal -->
  <div x-show="refineModal.open" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
       @click.self="closeRefineModal()">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-md mx-4 p-6">
      <div class="flex items-center gap-2 mb-1">
        <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <h3 class="text-base font-semibold text-gray-900" x-text="t('refine_modal_title')"></h3>
      </div>
      <p class="text-xs text-gray-400 mb-3"
         x-text="(refineModal.allSectionIds || []).length > 1
                 ? t('refine_modal_subtitle')
                 : t('refine_modal_subtitle_single')"></p>

      <!-- Section chips — hidden when there's only one section (text_post
           / article collapses to a single "body" — chip row would be
           pointless noise; the modal becomes a clean "describe + submit"). -->
      <div x-show="(refineModal.allSectionIds || []).length > 1" class="mb-3">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-medium text-gray-500" x-text="t('refine_modal_sections_label')"></span>
          <div class="flex items-center gap-2 text-[11px]">
            <button @click="refineModal.sectionIds = [...(refineModal.allSectionIds || [])]"
                    type="button"
                    class="text-accent hover:underline" x-text="t('refine_select_all')"></button>
            <span class="text-gray-300">·</span>
            <button @click="refineModal.sectionIds = []"
                    type="button"
                    class="text-gray-400 hover:text-gray-600 hover:underline" x-text="t('refine_select_none')"></button>
          </div>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="sid in (refineModal.allSectionIds || [])" :key="sid">
            <button type="button"
                    @click="toggleSectionInModal(sid)"
                    :class="refineModal.sectionIds.includes(sid)
                            ? 'bg-accent text-white border-accent'
                            : 'bg-white text-gray-600 border-gray-200 hover:border-accent/40'"
                    class="text-xs px-3 py-1 rounded-full border transition-all">
              <span x-text="sid"></span>
            </button>
          </template>
        </div>
      </div>

      <textarea x-model="refineModal.constraint" rows="4"
                :placeholder="t('refine_constraint_placeholder')"
                class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent"></textarea>
      <!-- Live progress feedback — elapsed seconds + rotating tips -->
      <div x-show="refineModal.loading" x-cloak
           class="mt-3 flex items-center gap-2 text-xs text-gray-500 bg-gray-50 border border-gray-100 rounded-lg px-3 py-2">
        <svg class="w-3.5 h-3.5 animate-spin shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        <span class="tabular-nums" x-text="t('refining_elapsed_prefix') + ' ' + (refineModal.elapsed || 0) + 's'"></span>
        <span class="text-gray-400">·</span>
        <span class="flex-1 truncate"
              x-text="[t('refine_tip_0'), t('refine_tip_1'), t('refine_tip_2')][refineModal.tipIndex || 0]"></span>
      </div>

      <p x-show="refineModal.error" x-text="refineModal.error"
         class="mt-2 text-xs text-red-500 bg-red-50 rounded-lg px-3 py-2"></p>
      <div class="flex items-center justify-end gap-2 mt-4">
        <button @click="closeRefineModal()"
                class="text-xs text-gray-500 hover:text-gray-700 px-3 py-2 rounded-lg" x-text="t('btn_cancel')"></button>
        <button @click="submitRefine()"
                :disabled="refineModal.loading || !refineModal.constraint.trim()"
                class="inline-flex items-center gap-1.5 bg-accent text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-accent-hover disabled:opacity-50 transition-colors">
          <svg x-show="!refineModal.loading" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          <svg x-show="refineModal.loading" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span x-text="refineModal.loading ? t('refining') : t('btn_refine')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Article Cover Side Panel ─────────────────────────────────
       Slides in from the right after the user clicks "🎨 配图" in the
       result action card. Auto-derives a brief + visual tags + 1-2
       reference assets from the offer's library on first open
       (cached per-creation), then lets the user tweak before generating.
       Refines (v2, v3) reuse /image-jobs/{id}/refine — the latest
       version becomes the article's cover_image_url automatically. -->
  <div x-show="cover.open" x-cloak
       class="fixed inset-0 z-50 flex justify-end"
       @keydown.escape.window="cover.open && closeCoverPanel()">
    <div class="absolute inset-0 bg-black/30" @click="closeCoverPanel()"></div>
    <aside class="relative bg-white w-full sm:w-[480px] h-full overflow-y-auto shadow-2xl flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white z-10">
        <div class="flex items-center gap-2">
          <span class="text-lg">🎨</span>
          <h2 class="text-base font-semibold text-gray-900" x-text="t('cover_panel_title')"></h2>
        </div>
        <button @click="closeCoverPanel()" class="text-gray-400 hover:text-gray-700 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="flex-1 px-5 py-4 space-y-4">
        <!-- Loading skeleton on first derive -->
        <template x-if="cover.loading && !cover.brief">
          <div class="space-y-3">
            <div class="h-4 bg-gray-100 rounded animate-pulse w-32"></div>
            <div class="h-20 bg-gray-100 rounded animate-pulse"></div>
            <div class="h-4 bg-gray-100 rounded animate-pulse w-40"></div>
            <div class="h-12 bg-gray-100 rounded animate-pulse"></div>
            <p class="text-[11px] text-gray-400" x-text="t('cover_deriving_hint')"></p>
          </div>
        </template>

        <!-- Brief textarea — server-derived, user-editable -->
        <template x-if="!cover.loading || cover.brief">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5" x-text="t('cover_brief_label')"></label>
          <textarea x-model="cover.brief"
                    rows="3"
                    :placeholder="t('cover_brief_placeholder')"
                    class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-400 resize-none"></textarea>
          <!-- Tags — informational only; show what the model "saw" -->
          <div x-show="cover.tags.length" class="flex flex-wrap gap-1.5 mt-2">
            <span class="text-[10px] text-gray-400 mr-1" x-text="t('cover_tags_label')"></span>
            <template x-for="(tg, i) in cover.tags" :key="i">
              <span class="text-[11px] bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full" x-text="tg"></span>
            </template>
          </div>
        </div>
        </template>

        <!-- Aspect (read-only badge — picked by platform) -->
        <div class="flex items-center justify-between text-xs">
          <span class="text-gray-600" x-text="t('cover_aspect_label')"></span>
          <span class="text-gray-700 font-medium px-2 py-0.5 rounded bg-gray-100" x-text="cover.aspect"></span>
        </div>

        <!-- Reference grid: suggested + uploads + add buttons -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5" x-text="t('cover_refs_label')"></label>
          <div class="grid grid-cols-4 gap-2">
            <!-- Selected asset thumbnails (from suggestions or picker) -->
            <template x-for="(rid, i) in cover.refIds" :key="rid">
              <div class="relative aspect-square rounded-lg overflow-hidden border border-purple-300 bg-gray-50 group">
                <img :src="coverAssetPreviewUrl(rid)" class="w-full h-full object-cover" loading="lazy"
                     x-show="coverAssetPreviewUrl(rid)" />
                <div x-show="!coverAssetPreviewUrl(rid)" class="w-full h-full flex items-center justify-center text-[10px] text-gray-400">✓<span class="ml-1" x-text="i+1"></span></div>
                <button @click="toggleCoverRef(rid)"
                        class="absolute top-1 right-1 w-5 h-5 bg-white/90 rounded-full flex items-center justify-center text-gray-600 hover:bg-white opacity-0 group-hover:opacity-100 transition-opacity"
                        :title="t('cover_ref_remove')">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </template>
            <!-- Uploaded references -->
            <template x-for="(u, i) in cover.uploads" :key="u.upload_id">
              <div class="relative aspect-square rounded-lg overflow-hidden border border-purple-300 bg-gray-50 group">
                <img :src="u.url" class="w-full h-full object-cover" loading="lazy" />
                <button @click="removeCoverUpload(i)"
                        class="absolute top-1 right-1 w-5 h-5 bg-white/90 rounded-full flex items-center justify-center text-gray-600 hover:bg-white opacity-0 group-hover:opacity-100 transition-opacity">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </template>
            <!-- Add-from-library tile -->
            <button @click="openCoverPicker()"
                    class="aspect-square rounded-lg border-2 border-dashed border-gray-300 hover:border-purple-400 hover:bg-purple-50/50 text-gray-500 hover:text-purple-600 flex flex-col items-center justify-center gap-1 transition-colors"
                    :title="t('cover_add_from_library')">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              <span class="text-[10px]" x-text="t('cover_add_lib')"></span>
            </button>
            <!-- Upload tile -->
            <label class="aspect-square rounded-lg border-2 border-dashed border-gray-300 hover:border-purple-400 hover:bg-purple-50/50 text-gray-500 hover:text-purple-600 flex flex-col items-center justify-center gap-1 transition-colors cursor-pointer"
                   :title="t('cover_upload_title')">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <span class="text-[10px]" x-text="t('cover_upload')"></span>
              <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" @change="uploadCoverRef($event)" />
            </label>
          </div>
          <p x-show="!cover.refIds.length && !cover.uploads.length && !cover.loading"
             class="text-[11px] text-gray-400 mt-1.5"
             x-text="t('cover_refs_empty_hint')"></p>
        </div>

        <!-- Generate button -->
        <button @click="generateCover()"
                :disabled="cover.generating || !cover.brief.trim()"
                class="w-full inline-flex items-center justify-center gap-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-xl shadow-sm transition-all">
          <svg x-show="!cover.generating" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
          <svg x-show="cover.generating" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span x-text="cover.generating ? t('cover_generating') : (cover.imageUrl ? t('cover_regenerate') : t('cover_generate'))"></span>
        </button>

        <!-- Result preview -->
        <div x-show="cover.imageUrl" class="space-y-2">
          <div class="border-t border-gray-100 pt-3">
            <div class="rounded-xl overflow-hidden bg-gray-50 border border-gray-200">
              <img :src="cover.imageUrl" class="w-full max-h-[55vh] object-contain" />
            </div>
            <div class="flex items-center justify-between mt-2 text-xs">
              <a :href="cover.imageUrl" target="_blank" download
                 class="text-gray-500 hover:text-purple-600 inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span x-text="t('cover_download')"></span>
              </a>
              <span class="text-gray-400 text-[10px]" x-text="t('cover_set_as_cover_hint')"></span>
            </div>
          </div>

          <!-- Lineage chips -->
          <div x-show="cover.lineage.length > 1" class="flex items-center gap-1.5 overflow-x-auto pb-1">
            <span class="text-[10px] text-gray-400 shrink-0" x-text="t('cover_versions_label')"></span>
            <template x-for="(j, idx) in cover.lineage" :key="j.id">
              <button @click="switchCoverVersion(j.id, j.image_url)"
                      :class="cover.jobId === j.id ? 'ring-2 ring-purple-500' : 'opacity-70 hover:opacity-100'"
                      class="shrink-0 w-12 h-12 rounded-md overflow-hidden bg-gray-50 border border-gray-200 transition-all">
                <img :src="j.image_url" class="w-full h-full object-cover" loading="lazy" />
              </button>
            </template>
          </div>

          <!-- Refine bar -->
          <div class="flex items-center gap-2 pt-1">
            <input type="text" x-model="cover.refineText"
                   @keydown.meta.enter="refineCover()" @keydown.ctrl.enter="refineCover()"
                   :placeholder="t('cover_refine_placeholder')"
                   class="flex-1 text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-400" />
            <button @click="refineCover()"
                    :disabled="cover.refineRunning || !cover.refineText.trim()"
                    class="inline-flex items-center gap-1 bg-gray-800 hover:bg-gray-900 disabled:opacity-50 text-white text-xs font-medium px-3 py-2 rounded-lg">
              <svg x-show="!cover.refineRunning" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              <svg x-show="cover.refineRunning" class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span x-text="cover.refineRunning ? t('cover_refine_running') : t('cover_refine_btn')"></span>
            </button>
          </div>

          <!-- Memory-capture chip after a successful refine. Mirrors
               image-studio's pattern; click → save modal. Auto-clears
               after 30s if ignored. -->
          <div x-show="cover.memoryChipText" x-cloak
               class="mt-2 inline-flex items-center gap-1.5 bg-purple-50 border border-purple-200 rounded-full pl-2.5 pr-1 py-0.5">
            <span class="text-[11px] text-purple-700" x-text="t('memory_chip_prefix')"></span>
            <span class="text-[11px] text-purple-900 font-medium max-w-[160px] truncate"
                  :title="cover.memoryChipText"
                  x-text="'「' + cover.memoryChipText + '」'"></span>
            <button type="button"
                    class="text-[11px] text-white bg-purple-600 hover:bg-purple-500 rounded-full px-2 py-0.5 ml-1"
                    @click="openMemorySaveFromCover()"
                    x-text="t('memory_chip_save')"></button>
            <button type="button"
                    class="text-purple-400 hover:text-purple-700 px-1"
                    @click="cover.memoryChipText = ''"
                    :title="t('memory_chip_dismiss')">×</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Cover asset picker (nested modal — opens from inside the panel) -->
  <div x-show="cover.pickerOpen" x-cloak
       class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40"
       @click.self="cover.pickerOpen = false">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl mx-4 max-h-[80vh] flex flex-col">
      <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-900" x-text="t('cover_picker_title')"></h3>
        <button @click="cover.pickerOpen = false" class="text-gray-400 hover:text-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <div x-show="!cover.pickerAssets.length" class="text-center text-gray-400 text-sm py-12">
          <p x-text="t('cover_picker_empty')"></p>
          <a x-show="offerId" :href="'/asset-library.html?offer_id=' + offerId" class="text-xs text-accent hover:underline mt-2 inline-block">
            <span x-text="t('cover_picker_go_lib')"></span> →
          </a>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
          <template x-for="a in cover.pickerAssets" :key="a.id">
            <button @click="toggleCoverRef(a.id)"
                    :class="cover.refIds.includes(a.id) ? 'ring-2 ring-purple-500' : 'hover:opacity-80'"
                    class="aspect-square rounded-lg overflow-hidden bg-gray-50 border border-gray-200 transition-all relative">
              <img :src="a.thumb_url" class="w-full h-full object-cover" loading="lazy" />
              <div x-show="cover.refIds.includes(a.id)"
                   class="absolute top-1 right-1 w-5 h-5 bg-purple-600 rounded-full flex items-center justify-center">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
              </div>
            </button>
          </template>
        </div>
      </div>
      <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-between">
        <span class="text-xs text-gray-500">
          <span x-text="cover.refIds.length"></span> / 5
        </span>
        <button @click="cover.pickerOpen = false"
                class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium px-4 py-2 rounded-lg" x-text="t('cover_picker_done')"></button>
      </div>
    </div>
  </div>

  <script>
    function contentStudioPage() {
      return {
        // Trend-bridge panel — see frontend/js/trend-panel.js.
        ...window.odTrendPanel.makeState(),
        // Output-language picker — see frontend/js/lang-picker.js.
        // Defaults to UI locale; flips to KB language once an offer
        // is selected (via detectFromOffer); user can override.
        ...window.odLangPicker.makeState(),

        offers: [],
        offerId: '',
        strategyUnits: [],
        strategyUnitId: '',
        selectedUnit: null,
        modelOptions: [],
        modelKey: '',
        // When arriving from Topic Studio, carries the source plan's
        // UUID so the backend can enrich the prompt with its full
        // structured fields (angle + key_points).
        topicPlanId: '',
        platforms: [],
        platformId: '',
        personas: [],
        personaId: '',
        goalOptions: [],
        goalId: 'seeding',
        topic: '',
        loading: false,
        suggestingTopic: false,
        scriptResult: null,
        structuredContent: null,
        creationId: null,
        copied: false,
        // Article-cover panel state. Lives in the same Alpine root as
        // the rest of the page so it can read creationId / platformId /
        // offerId without re-fetching. Suggest is cached via
        // ``derivedFor`` so reopening the panel after closing doesn't
        // burn another LLM call.
        cover: {
          open: false,
          loading: false,
          generating: false,
          brief: '',
          tags: [],
          aspect: '16:9',
          refIds: [],
          uploads: [],
          jobId: null,
          imageUrl: null,
          // Last error from /cover or /refine — surfaced inline below
          // the article (not just toast) so a user who closed the
          // panel still sees what went wrong without re-opening it.
          error: '',
          lineage: [],
          refineText: '',
          refineRunning: false,
          pickerOpen: false,
          pickerAssets: [],
          derivedFor: null,
          // Memory-capture chip after a successful refine; auto-clears
          // after 30s. memoryChipSourceRef is the parent job id so
          // captured rules can be traced back to the generation that
          // taught us.
          memoryChipText: '',
          memoryChipSourceRef: null,
        },
        // Per-section refinement state — shared across edit + AI rewrite
        editingSectionId: null,
        editingSectionText: '',
        editingSaving: false,
        refineModal: {
          open: false,
          allSectionIds: [],
          sectionIds: [],
          constraint: '',
          loading: false,
          error: '',
          elapsed: 0,            // declared up-front so Alpine reactivity tracks it
          tipIndex: 0,
        },
        contextData: null,
        loadingCtx: false,

        async init() {
          document.title = t('content_studio_title') + ' - OpenLucid';
          const lang = getApiLang().slice(0, 2);
          const API = '/api/v1';
          try {
            const [offersRes, llmRes, platformsRes, personasRes, goalsRes] = await Promise.all([
              fetch(`${API}/offers?page_size=100`),
              // /apps/llm-options: sanitized model picker list (no
              // api_key) — guest-accessible.
              fetch(`${API}/apps/llm-options`),
              fetch(`${API}/apps/script-writer/platforms?lang=${lang}`),
              fetch(`${API}/apps/script-writer/personas?lang=${lang}`),
              fetch(`${API}/apps/script-writer/goals?lang=${lang}`),
            ]);
            if (offersRes.ok) this.offers = (await offersRes.json()).items || [];
            // Model expansion runs in the background — see topic-studio.html
            // for the full rationale (don't block offerId on /v1/models).
            this._llmConfigs = (llmRes.ok ? await llmRes.json() : []) || [];
            if (platformsRes.ok) {
              const all = await platformsRes.json();
              this.platforms = all.filter(p => p.content_type !== 'video');
              if (this.platforms.length) this.platformId = this.platforms[0].id;
            }
            if (personasRes.ok) this.personas = await personasRes.json();
            if (goalsRes.ok) {
              this.goalOptions = await goalsRes.json();
              if (this.goalOptions.length && !this.goalOptions.find(g => g.id === this.goalId)) {
                this.goalId = this.goalOptions[0].id;
              }
            }
          } catch(e) { console.error(e); }

          // Priority: URL param > last used > first offer
          const params = new URLSearchParams(location.search);
          const urlOffer = params.get('offer_id');
          const urlTopic = params.get('topic');
          const urlTopicPlanId = params.get('topic_plan_id');
          if (urlTopic && !this.topic) this.topic = urlTopic;
          if (urlTopicPlanId) {
            this.topicPlanId = urlTopicPlanId;
            // Surface the plan's persisted hotspot in the inherited
            // banner so the user knows the prompt rides the same trend.
            this.trendLoadInherited(urlTopicPlanId);
          }

          // When arriving from "Open in Creator" in Creations, pre-fill topic from the reference.
          const refCreationId = params.get('ref_creation_id');
          if (refCreationId) {
            try {
              const refRes = await fetch(`/api/v1/creations/${refCreationId}`);
              if (refRes.ok) {
                const ref = await refRes.json();
                if (!this.topic) this.topic = (ref.title || '').slice(0, 200);
                toast.info(t('ref_loaded_hint') + ' ' + (ref.title || ''));
              }
            } catch {}
          }
          // Standardised header-selector behaviour (v1.2.x).
          await this.$nextTick();
          this.offerId = window.odHeaderSelectors.pickInitialOffer(this.offers, "cs", urlOffer);
          window.odHeaderSelectors.rememberOffer("cs", this.offerId);

          window.odHeaderSelectors.expandConfigsToModels(this._llmConfigs || [], API).then(opts => {
            this.modelOptions = opts;
            this.modelKey = window.odHeaderSelectors.pickInitialModelKey(opts, "cs");
            window.odHeaderSelectors.rememberModelKey("cs", this.modelKey);
          }).catch(e => console.error('Model expansion failed', e));

          const urlUnit = params.get('strategy_unit_id') || '';
          if (this.offerId) {
            await this.loadStrategyUnits();
            if (urlUnit && this.strategyUnits.find(u => u.id === urlUnit)) {
              await this.$nextTick();
              this.strategyUnitId = urlUnit;
              this.selectedUnit = this.strategyUnits.find(u => u.id === urlUnit) || null;
            }
            await this.fetchContext();
            // Detect KB language for the initially-loaded offer so the
            // language picker reflects content language, not UI locale.
            window.odLangPicker.detectFromOffer(this, this.offerId);
          }
        },

        onModelChange() {
          window.odHeaderSelectors.rememberModelKey("cs", this.modelKey);
        },

        // ── Per-section refinement (manual edit + AI rewrite) ──
        // Mirrors script-writer.html. All four methods + the modal
        // markup below the </main> wrap the same backend trunk
        // (CreationService.refine_sections / update_section_text).

        startEditSection(sid, currentText) {
          this.editingSectionId = sid;
          this.editingSectionText = currentText || '';
        },

        // Bottom-CTA shortcut for the single-section case (article, post,
        // etc.) or first section in multi-section — opens the textarea,
        // scrolls to it, focuses so the user can start typing immediately.
        // For multi-section, this is the obvious entry point; users edit
        // other sections via the now-always-visible per-section ✏️ buttons.
        startEditFromCta() {
          const sections = this.structuredContent?.sections || {};
          const sids = Object.keys(sections);
          if (sids.length === 0) return;
          const sid = sids[0];
          this.startEditSection(sid, sections[sid]?.text || '');
          this.$nextTick(() => {
            const tas = document.querySelectorAll('textarea[x-model="editingSectionText"]');
            for (const ta of tas) {
              if (ta.offsetParent !== null) {
                ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
                ta.focus();
                break;
              }
            }
          });
        },

        cancelEditSection() {
          this.editingSectionId = null;
          this.editingSectionText = '';
        },

        async saveEditSection(sid) {
          if (!this.creationId || !this.editingSectionText.trim()) return;
          this.editingSaving = true;
          try {
            const r = await fetch(
              `/api/v1/creations/${this.creationId}/sections/${encodeURIComponent(sid)}`,
              {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_text: this.editingSectionText.trim() }),
              },
            );
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              toast.error((err.error?.message || err.detail || 'Save failed').toString());
            } else {
              const updated = await r.json();
              if (updated && updated.structured_content) {
                this.structuredContent = updated.structured_content;
                this.scriptResult = updated.content || this.scriptResult;
              } else if (this.structuredContent && this.structuredContent.sections) {
                this.structuredContent.sections[sid] = {
                  ...(this.structuredContent.sections[sid] || {}),
                  text: this.editingSectionText.trim(),
                };
              }
              toast.success(t('section_save_ok') || 'Section updated');
              this.cancelEditSection();
            }
          } catch (e) {
            toast.error(t('network_error'));
          } finally {
            this.editingSaving = false;
          }
        },

        openRefineModal(sectionIds) {
          // Guard against re-entry while a refine is in flight.
          if (this.refineModal.loading) return;
          const all = Object.keys(this.structuredContent?.sections || {});
          this.refineModal = {
            open: true,
            allSectionIds: all,
            sectionIds: (sectionIds && sectionIds.length) ? [...sectionIds] : [...all],
            constraint: '',
            loading: false,
            error: '',
            elapsed: 0,
            tipIndex: 0,
          };
        },

        closeRefineModal() {
          if (this._refineTimer) {
            clearInterval(this._refineTimer);
            this._refineTimer = null;
          }
          this.refineModal.loading = false;
          this.refineModal.open = false;
        },

        toggleSectionInModal(sid) {
          const sids = this.refineModal.sectionIds;
          const i = sids.indexOf(sid);
          if (i >= 0) sids.splice(i, 1);
          else sids.push(sid);
        },

        async submitRefine() {
          if (!this.creationId) return;
          const c = (this.refineModal.constraint || '').trim();
          if (!c) {
            this.refineModal.error = t('refine_constraint_required') || 'Constraint required';
            return;
          }
          if (!this.refineModal.sectionIds || this.refineModal.sectionIds.length === 0) {
            this.refineModal.error = t('refine_no_sections_selected') || 'Pick at least one section';
            return;
          }
          this.refineModal.loading = true;
          this.refineModal.error = '';
          // Live progress feedback (wall-clock + rotating tip line) —
          // LLM call takes 5-30s; without movement users assume crash.
          this.refineModal.elapsed = 0;
          this.refineModal.tipIndex = 0;
          if (this._refineTimer) clearInterval(this._refineTimer);
          this._refineTimer = setInterval(() => {
            this.refineModal.elapsed += 1;
            if (this.refineModal.elapsed % 5 === 0) {
              this.refineModal.tipIndex = (this.refineModal.tipIndex + 1) % 3;
            }
          }, 1000);
          try {
            const r = await fetch(
              `/api/v1/creations/${this.creationId}/refine-sections`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  section_ids: this.refineModal.sectionIds,
                  constraint: c,
                }),
              },
            );
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              this.refineModal.error = (err.error?.message || err.detail || 'Refinement failed').toString();
            } else {
              const updated = await r.json();
              if (updated && updated.structured_content) {
                this.structuredContent = updated.structured_content;
                this.scriptResult = updated.content || this.scriptResult;
              }
              toast.success(t('section_refine_ok') || 'Sections refined');
              this.closeRefineModal();
            }
          } catch (e) {
            this.refineModal.error = t('network_error');
          } finally {
            this.refineModal.loading = false;
            if (this._refineTimer) {
              clearInterval(this._refineTimer);
              this._refineTimer = null;
            }
          }
        },

        _derivedWordCount() {
          const p = this.platforms.find(x => x.id === this.platformId);
          const cap = p?.max_script_chars;
          if (!cap) return 1000;
          // 60% of the cap puts WeChat (3000) at 1800 — squarely in
          // the platform's "1500-3000 字最佳" target range. Round to
          // nearest 50 for prompt readability; clamp to schema bounds.
          const raw = Math.round(cap * 0.6 / 50) * 50;
          return Math.max(50, Math.min(5000, raw));
        },

        async onOfferChange() {
          this.scriptResult = null;
          this.structuredContent = null;
          this.creationId = null;
          this._resetCoverState();
          this.strategyUnitId = '';
          this.selectedUnit = null;
          this.strategyUnits = [];
          this.contextData = null;
          // Reset the lang picker so the new offer's KB language can
          // re-detect (otherwise an earlier override sticks).
          window.odLangPicker.resetForNewOffer(this);
          if (this.offerId) {
            window.odHeaderSelectors.rememberOffer("cs", this.offerId);
            await this.loadStrategyUnits();
            await this.fetchContext();
            await window.odLangPicker.detectFromOffer(this, this.offerId);
          }
        },

        async loadStrategyUnits() {
          if (!this.offerId) return;
          try {
            const res = await fetch(`/api/v1/strategy-units?offer_id=${this.offerId}&page_size=50`);
            if (res.ok) {
              const data = await res.json();
              this.strategyUnits = data.items || [];
            }
          } catch(e) { console.error(e); }
        },

        onStrategyChange() {
          this.selectedUnit = this.strategyUnits.find(u => u.id === this.strategyUnitId) || null;
          this.fetchContext();
        },

        async fetchContext() {
          if (!this.offerId) return;
          this.loadingCtx = true;
          try {
            let url = `/api/v1/apps/topic-studio/context-preview?offer_id=${this.offerId}`;
            if (this.strategyUnitId) url += `&strategy_unit_id=${this.strategyUnitId}`;
            const res = await fetch(url);
            if (res.ok) this.contextData = await res.json();
          } catch(e) { console.error(e); }
          finally { this.loadingCtx = false; }
        },

        async suggestTopic() {
          if (!this.offerId || this.suggestingTopic) return;
          this.suggestingTopic = true;
          try {
            const sel = window.odHeaderSelectors.splitModelKey(this.modelKey);
            this.topic = await window.odSuggestTopic({
              offer_id: this.offerId,
              goal: this.goalId,
              config_id: sel.config_id || undefined,
              model_override: sel.model_name || undefined,
            });
          } catch(e) { console.error(e); toast.error(e.message); }
          this.suggestingTopic = false;
        },

        async doGenerate() {
          if (!this.offerId) return;
          this.loading = true;
          this.scriptResult = null;
          this.structuredContent = null;
          this.creationId = null;
          this._resetCoverState();
          this.copied = false;

          try {
            const sel = window.odHeaderSelectors.splitModelKey(this.modelKey);
            const res = await fetch('/api/v1/apps/script-writer/generate/stream', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                offer_id: this.offerId,
                strategy_unit_id: this.strategyUnitId || undefined,
                topic_plan_id: this.topicPlanId || undefined,
                // Trend-bridge panel state → external_context_text/url.
                ...window.odTrendPanel.toBody(this),
                topic: this.topic.trim(),
                goal: this.goalId,
                // Derive a target length from the selected platform.
                // Without this content-studio falls through to the
                // backend default (150) — the LLM then dutifully
                // produces ~200-char output even when the WeChat body
                // says "1500-3000 字最佳". Long-form lands closer to
                // the platform cap than short video does.
                word_count: this._derivedWordCount(),
                // language: only sent when user manually overrode the
                // picker. Otherwise omitted → backend's
                // resolve_output_language() runs KB detection.
                ...window.odLangPicker.toBody(this),
                config_id: sel.config_id || undefined,
                model_override: sel.model_name || undefined,
                platform_id: this.platformId || undefined,
                persona_id: this.personaId || undefined,
                goal_id: this.goalId,
                // Tag the source so the creations-list filter can
                // distinguish Content Studio output from Script Writer
                // (we share the same generate endpoint). Without this,
                // every content-studio creation got filed under
                // "视频脚本" / source_app="script_writer".
                source_app: 'content_studio',
              }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              toast.error(t('generate_failed') + (err.detail || ''));
              this.loading = false;
              return;
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let content = '';
            let sawTerminal = false;  // saw a clean done OR error event
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const parts = buffer.split('\n\n');
              buffer = parts.pop();
              for (const part of parts) {
                if (!part.trim()) continue;
                const lines = part.trim().split('\n');
                let eventType = 'message', data = '';
                for (const line of lines) {
                  if (line.startsWith('event: ')) eventType = line.slice(7);
                  else if (line.startsWith('data: ')) data = line.slice(6);
                }
                if (eventType === 'token') {
                  content += JSON.parse(data);
                  this.scriptResult = content;
                } else if (eventType === 'done') {
                  sawTerminal = true;
                  const result = JSON.parse(data);
                  if (result.script) this.scriptResult = result.script;
                  if (result.structured_content) this.structuredContent = result.structured_content;
                  if (result.creation_id) this.creationId = result.creation_id;
                  // Silent save failure → editing won't work; tell the user.
                  if (result.save_failed) toast.warning(t('generate_save_failed'));
                } else if (eventType === 'error') {
                  // Backend signaled a failure (LLM timeout / connect
                  // error / rate limit). Show the message — without
                  // this the spinner just stops with no explanation.
                  sawTerminal = true;
                  try {
                    const errData = JSON.parse(data);
                    toast.error(t('generate_failed') + (errData.message || ''));
                  } catch {
                    toast.error(t('generate_failed'));
                  }
                }
                // ignore 'thinking' / 'thinking_done' / 'started' — purely informational
              }
            }
            // Connection closed without a done OR error event = abrupt
            // disconnection (network drop, server crash). Surface it
            // rather than leaving the user wondering.
            if (!sawTerminal && !content) {
              toast.error(t('generate_failed_retry') || t('generate_failed'));
            }
