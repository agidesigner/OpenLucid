          } catch(e) { console.error(e); toast.error(e.message); }
          this.loading = false;
        },

        async copyAll() {
          let text = '';
          if (this.structuredContent?.metadata?.title) text += this.structuredContent.metadata.title + '\n\n';
          text += this.scriptResult || '';
          if (this.structuredContent?.metadata?.hashtags?.length) {
            text += '\n\n' + this.structuredContent.metadata.hashtags.join(' ');
          }
          const ok = await window.odCopyText(text);
          if (ok) {
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
          }
        },

        // ── Article cover ─────────────────────────────────────────
        // Side-panel flow: open after article is generated → server
        // LLM-derives a brief + visual tags + 1-2 auto-selected
        // reference assets from the offer's library → user tweaks →
        // POST /creations/{id}/cover with reference images. Refines
        // (v2, v3) go through the regular /image-jobs/{id}/refine.
        //
        // The inline strip below the article action card mirrors the
        // panel state (generating / ready / failed) — that's the
        // user's anchor when they're not actively looking at the
        // panel. Clicking the strip reopens the panel.

        _resetCoverState() {
          // Called when offer changes or a new article is being
          // generated — without this the previous article's cover
          // state (image, lineage, error) would bleed into the new
          // article and the inline strip would show a wrong thumbnail.
          //
          // Cleared aggressively (every field except ``open`` and
          // ``pickerAssets`` would silently leak):
          //   - aspect: a previous 公众号 (2.35:1) article's ratio
          //     would override the next article's platform default
          //     until suggest succeeded.
          //   - pickerAssets: a switched-to offer would render the
          //     PRIOR offer's asset library in its picker.
          //   - pickerOpen: a picker left open mid-flow would re-
          //     appear on the new article.
          //   - loading / generating / refineRunning: a request
          //     that errored out before clearing its flag would
          //     leave the new panel stuck "in flight" forever.
          this.cover.brief = '';
          this.cover.tags = [];
          this.cover.aspect = '16:9';
          this.cover.refIds = [];
          this.cover.uploads = [];
          this.cover.jobId = null;
          this.cover.imageUrl = null;
          this.cover.error = '';
          this.cover.lineage = [];
          this.cover.refineText = '';
          this.cover.derivedFor = null;
          this.cover.pickerAssets = [];
          this.cover.pickerOpen = false;
          this.cover.loading = false;
          this.cover.generating = false;
          this.cover.refineRunning = false;
          this.cover.memoryChipText = '';
          this.cover.memoryChipSourceRef = null;
        },

        async openCoverPanel() {
          if (!this.creationId) return;
          this.cover.open = true;
          // Pre-load offer's image assets so suggested-refIds thumbnails
          // resolve in the small grid without the user opening the
          // full picker first. ~60 thumbs is a single cheap request.
          if (this.offerId && !this.cover.pickerAssets.length) {
            await this._loadCoverPickerAssets();
          }
          if (this.cover.derivedFor === this.creationId) return;
          await this.runCoverSuggest();
        },

        async _loadCoverPickerAssets() {
          // The list endpoint at GET /api/v1/assets only accepts
          // ``scope_type`` + ``scope_id`` — passing ``offer_id`` /
          // ``asset_type`` is silently ignored, which would surface
          // unrelated cross-offer assets (or non-image rows). We use
          // /assets/search instead, which understands ``asset_type``,
          // and pin scope to the current offer.
          //
          // ``thumb_url`` is not a field the API returns — it's
          // derived client-side from the thumbnail endpoint URL.
          // Image-studio uses the same convention; keep them in sync.
          // Drop logo-sized (<600×600) images: they pollute the
          // style-reference signal in the model's edits call.
          try {
            const r = await fetch(
              `/api/v1/assets/search?scope_type=offer&scope_id=${this.offerId}`
              + `&asset_type=image&page_size=60`
            );
            if (!r.ok) return;
            const d = await r.json();
            const items = (d.items || [])
              .filter(a => (a.metadata_json?.width || 0) >= 600
                        || (a.metadata_json?.height || 0) >= 600)
              .map(a => ({
                id: a.id,
                thumb_url: `/api/v1/assets/${a.id}/thumbnail`,
                label: a.title || a.file_name || '',
              }));
            this.cover.pickerAssets = items;
          } catch (e) { console.error(e); }
        },

        closeCoverPanel() { this.cover.open = false; },

        async runCoverSuggest() {
          if (!this.creationId) return;
          this.cover.loading = true;
          // ``cover.aspect`` is left at whatever ``_resetCoverState``
          // initialized (16:9 default). Suggest overwrites it with the
          // platform-correct value on success; on failure (HTTP error
          // or network throw) we leave the safe default rather than
          // letting a previous article's aspect leak through.
          try {
            const url = `/api/v1/creations/${this.creationId}/cover/suggest`
                      + (this.platformId ? `?platform_id=${encodeURIComponent(this.platformId)}` : '');
            const r = await fetch(url);
            if (r.ok) {
              const d = await r.json();
              this.cover.brief = d.brief || '';
              this.cover.tags = d.tags || [];
              this.cover.aspect = d.aspect_ratio || '16:9';
              this.cover.refIds = [...(d.suggested_asset_ids || [])];
            }
          } catch(e) {
            console.error('cover-suggest failed', e);
          } finally {
            // Fallback brief: when the LLM is unavailable / errors /
            // returns empty, seed the textarea with the article title
            // (or topic) so the Generate button isn't disabled and the
            // user gets something relevant on first paint. The "AI
            // suggests, human approves" pattern — not a blank form.
            if (!this.cover.brief.trim()) {
              this.cover.brief = (
                this.structuredContent?.metadata?.title
                || this.topic
                || ''
              ).slice(0, 200);
            }
            this.cover.derivedFor = this.creationId;
            this.cover.loading = false;
          }
        },

        async generateCover() {
          if (!this.creationId || this.cover.generating) return;
          if (!this.cover.brief.trim()) {
            toast.error(t('cover_brief_required') || 'Brief is required');
            return;
          }
          this.cover.generating = true;
          this.cover.error = '';
          try {
            const r = await fetch(`/api/v1/creations/${this.creationId}/cover`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                brief: this.cover.brief.trim(),
                aspect_ratio: this.cover.aspect,
                reference_asset_ids: this.cover.refIds,
                extra_uploads: this.cover.uploads.map(u => ({
                  upload_id: u.upload_id,
                  role: 'supplemental',
                  label: u.label || null,
                })),
              }),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              const msg = (err.error?.message || err.detail || t('cover_generate_failed') || 'Generate failed').toString();
              this.cover.error = msg;
              toast.error(msg);
              return;
            }
            const job = await r.json();
            this.cover.jobId = job.id;
            this.cover.imageUrl = job.image_url || null;
            await this.loadCoverLineage();
          } catch(e) {
            console.error(e);
            const msg = (e && e.message) || t('cover_generate_failed') || 'Generate failed';
            this.cover.error = msg;
            toast.error(msg);
          } finally {
            this.cover.generating = false;
          }
        },

        async refineCover() {
          if (!this.cover.jobId || !this.cover.refineText.trim() || this.cover.refineRunning) return;
          this.cover.refineRunning = true;
          // Snapshot before clear — used to prefill the memory chip
          // when refine succeeds.
          const instruction = this.cover.refineText.trim();
          try {
            const r = await fetch(`/api/v1/image-jobs/${this.cover.jobId}/refine`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ refinement: instruction }),
            });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              toast.error((err.error?.message || err.detail || t('cover_refine_failed') || 'Refine failed').toString());
              return;
            }
            const job = await r.json();
            this.cover.jobId = job.id;
            this.cover.imageUrl = job.image_url || null;
            this.cover.refineText = '';
            this.cover.memoryChipText = instruction;
            this.cover.memoryChipSourceRef = job.id || null;
            clearTimeout(this._coverMemoryTimer);
            this._coverMemoryTimer = setTimeout(() => {
              this.cover.memoryChipText = '';
            }, 30000);
            await this.loadCoverLineage();
          } catch(e) {
            console.error(e);
            toast.error(t('cover_refine_failed') || 'Refine failed');
          } finally {
            this.cover.refineRunning = false;
          }
        },

        openMemorySaveFromCover() {
          if (!this.cover.memoryChipText) return;
          const offer = this.offers?.find(o => o.id === this.offerId);
          window.odMemorySave?.open({
            offerId: this.offerId,
            merchantId: offer?.merchant_id || null,
            offerName: offer?.name || '',
            merchantName: offer?.merchant_name || '',
            surface: 'image',
            content: this.cover.memoryChipText,
            source: 'refine_capture',
            sourceRef: this.cover.memoryChipSourceRef,
            onSaved: () => {
              this.cover.memoryChipText = '';
            },
          });
        },

        async loadCoverLineage() {
          if (!this.cover.jobId) { this.cover.lineage = []; return; }
          try {
            const r = await fetch(`/api/v1/image-jobs/${this.cover.jobId}/lineage`);
            if (!r.ok) return;
            this.cover.lineage = await r.json();
          } catch {}
        },

        switchCoverVersion(jobId, imageUrl) {
          this.cover.jobId = jobId;
          this.cover.imageUrl = imageUrl;
        },

        async uploadCoverRef(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          if (!this.offerId) { toast.error(t('cover_offer_required') || 'No offer'); event.target.value = ''; return; }
          // Cap check BEFORE the network round-trip — otherwise the 5th
          // upload reaches the server, gets persisted to tmp/image_refs,
          // and then we reject it client-side, leaving an orphan file
          // on disk forever (the schema's max_length=4 catches submit
          // but not upload). Schema cap = 4 supplemental uploads.
          if (this.cover.uploads.length >= 4) {
            toast.info(t('cover_upload_cap') || 'Up to 4 uploads');
            event.target.value = '';
            return;
          }
          const fd = new FormData();
          fd.append('file', file);
          fd.append('offer_id', this.offerId);
          try {
            const r = await fetch('/api/v1/image-jobs/reference-upload', { method: 'POST', body: fd });
            if (!r.ok) {
              const err = await r.json().catch(() => ({}));
              toast.error((err.error?.message || err.detail || t('cover_upload_failed') || 'Upload failed').toString());
              return;
            }
            const u = await r.json();
            this.cover.uploads.push(u);
          } catch(e) {
            toast.error(t('cover_upload_failed') || 'Upload failed');
          } finally {
            event.target.value = '';
          }
        },

        removeCoverUpload(idx) {
          this.cover.uploads.splice(idx, 1);
        },

        async openCoverPicker() {
          if (!this.offerId) return;
          this.cover.pickerOpen = true;
          if (!this.cover.pickerAssets.length) {
            await this._loadCoverPickerAssets();
          }
        },

        toggleCoverRef(assetId) {
          const i = this.cover.refIds.indexOf(assetId);
          if (i >= 0) this.cover.refIds.splice(i, 1);
          // Cap at 5 references (matches schema max_length).
          else if (this.cover.refIds.length < 5) this.cover.refIds.push(assetId);
          else toast.info(t('cover_refs_cap') || 'Up to 5 references');
        },

        coverAssetPreviewUrl(assetId) {
          const a = this.cover.pickerAssets.find(x => x.id === assetId);
          if (a && a.thumb_url) return a.thumb_url;
          // Fallback: derive the thumbnail URL even when the asset
          // wasn't in the cached list (e.g. suggested IDs that didn't
          // pass the >=600px filter, or a stale cache after offer
          // switch). The thumbnail endpoint resolves by ID alone.
          return assetId ? `/api/v1/assets/${assetId}/thumbnail` : '';
        },
      };
    }
  </script>
</body>
</html>
